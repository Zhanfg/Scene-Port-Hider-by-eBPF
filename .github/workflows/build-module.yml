name: Build KernelSU module

on:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release after building"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag when create_release is true"
        required: false
        type: string
        default: "v2.0.3"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: scene-port-hider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "25.2.9519653"
  ANDROID_API: "26"
  BPFTOOL_VERSION: "v7.7.0"
  BPFTOOL_SHA256: "09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c"
  ZLIB_COMMIT: "51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf"
  ELFUTILS_COMMIT: "18a015c0b0787ba5acb39801ab7c17dac50f584d"
  LIBBPF_COMMIT: "f7081a6baf3f54949aacb8c2fc11bb30783b83e9"

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zip unzip xxd

      - name: ShellCheck build scripts
        run: |
          shellcheck \
            build_deps_android.sh \
            tools/build_from_btf.sh \
            build.sh \
            package.sh

      - name: ShellCheck Android runtime scripts
        run: |
          # Android /system/bin/sh supports local variables, while ShellCheck's
          # generic POSIX mode reports SC3043. Dynamic module paths and ps
          # USER,ARGS parsing are intentional and scoped to these files.
          shellcheck -s dash -e SC3043,SC1090,SC2009 \
            module_process.sh \
            hideport_start.sh \
            customize.sh \
            uninstall.sh

      - name: ShellCheck tests
        run: shellcheck -x tests/test_module_safety.sh

      - name: Run module safety tests
        run: bash tests/test_module_safety.sh

      - name: Validate release request
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]

  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint binutils bzip2 clang curl file gettext git \
            libtool lld make pkg-config unzip xxd xz-utils zip

      - name: Install pinned Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --version
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "ndk;${ANDROID_NDK_VERSION}"
          ndk_path="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          test -x "$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          echo "ANDROID_NDK=$ndk_path" >> "$GITHUB_ENV"

      - name: Install verified bpftool
        run: |
          archive="$RUNNER_TEMP/bpftool.tar.gz"
          curl -fL --retry 3 \
            "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz" \
            -o "$archive"
          echo "$BPFTOOL_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bpftool"
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$RUNNER_TEMP/bpftool"
          bpftool_path="$(find "$RUNNER_TEMP/bpftool" -type f -name bpftool -print -quit)"
          test -n "$bpftool_path"
          chmod +x "$bpftool_path"
          echo "BPFTOOL=$bpftool_path" >> "$GITHUB_ENV"
          "$bpftool_path" version

      - name: Cache pinned Android arm64 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/hideport-deps
          key: >-
            hideport-deps-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-
            zlib-${{ env.ZLIB_COMMIT }}-elfutils-${{ env.ELFUTILS_COMMIT }}-
            libbpf-${{ env.LIBBPF_COMMIT }}-${{ hashFiles('build_deps_android.sh') }}

      - name: Build module from committed BTF
        run: bash tools/build_from_btf.sh

      - name: Verify native build outputs
        run: |
          readelf -h system/bin/hideport.bpf.o | grep -Eq 'Machine:[[:space:]]+Linux BPF'
          readelf -h system/bin/hideport_loader | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h system/bin/hideport_loader | grep -Eq 'Machine:[[:space:]]+AArch64'
          if readelf -d system/bin/hideport_loader | grep -q '(NEEDED)'; then
            echo "hideport_loader unexpectedly contains dynamic dependencies" >&2
            exit 1
          fi
          file system/bin/hideport_loader

      - name: Stage and verify module artifact
        run: |
          cp ../hideSceneport_module.zip ./hideSceneport_module.zip
          cp ../hideSceneport_module.zip.sha256 ./hideSceneport_module.zip.sha256
          sha256sum -c hideSceneport_module.zip.sha256
          unzip -t hideSceneport_module.zip >/dev/null
          unzip -Z1 hideSceneport_module.zip | grep -Fqx build-manifest.txt

      - name: Upload module artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ScenePortHider_Release
          path: |
            hideSceneport_module.zip
            hideSceneport_module.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ScenePortHider_Release
          path: release-artifact

      - name: Verify release files
        working-directory: release-artifact
        run: |
          sha256sum -c hideSceneport_module.zip.sha256
          unzip -t hideSceneport_module.zip >/dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Scene Port Hider by eBPF ${{ env.RELEASE_TAG }}
          body: |
            Kernel module built from pinned dependencies and the BTF committed at this source revision.

            Verify `hideSceneport_module.zip.sha256` before installation. The package is kernel-specific and must not be installed on a device whose BTF fingerprint differs.
          files: |
            release-artifact/hideSceneport_module.zip
            release-artifact/hideSceneport_module.zip.sha256
